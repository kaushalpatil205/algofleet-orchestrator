apiVersion: apps/v1
kind: Deployment
metadata:
  name: s18-1-4h15min-xauusd
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s18-1-4h15min-xauusd
      component: strategy
  template:
    metadata:
      labels:
        app: s18-1-4h15min-xauusd
        component: strategy
    spec:
      containers:
      - name: strategy
        image: 561789488706.dkr.ecr.ap-south-1.amazonaws.com/strategy-engine:latest
        env:
        - name: TRADE_DB_URL
          value: "postgresql://algofleet:supersecretpassword@postgres.trading.svc.cluster.local:5432/algofleet"

        - name: STRATEGY_SCRIPT
          value: "Live/Strategy 18.1/4H-15min/Bridge-Strategy-18.1-4H-15min-XAUUSD-Live.py"
        - name: ENGINE_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              name: engine-config
              key: json
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "[ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 180 ]"
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -f /tmp/heartbeat"]
          initialDelaySeconds: 90
          periodSeconds: 15

