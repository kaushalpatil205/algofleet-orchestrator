apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: strategy-vpa
  namespace: trading
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s17-m3m2-v1-btcusd-sell
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: strategy
      minAllowed:
        cpu: "100m"
        memory: "256Mi"
      maxAllowed:
        cpu: "1000m"
        memory: "1Gi"
      controlledResources: ["cpu", "memory"]
