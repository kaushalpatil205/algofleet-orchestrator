apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: engine-config
  namespace: trading
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: engine-config
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: algofleet/engine-config
