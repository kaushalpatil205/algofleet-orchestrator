apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-dashboard
  namespace: trading
  labels:
    app: trade-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-dashboard
  template:
    metadata:
      labels:
        app: trade-dashboard
    spec:
      containers:
        - name: dashboard
          image: 561789488706.dkr.ecr.ap-south-1.amazonaws.com/trade-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: trading
type: Opaque
stringData:
  # In a strict production environment, this would be an ExternalSecret syncing from AWS Secrets Manager.
  # For this portfolio deployment, we store it as a native K8s secret directly.
  database-url: "postgresql://algofleet:supersecretpassword@postgres.trading.svc.cluster.local:5432/algofleet"
