name: Python Syntax Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run py_compile check
      run: |
        echo "Checking syntax for all Python files in the repository..."
        find . -name "*.py" -exec python -m py_compile {} +
        echo "All Python files compiled successfully!"
        
    - name: Lint with flake8
      run: |
        # Install flake8
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F821 --show-source --statistics
