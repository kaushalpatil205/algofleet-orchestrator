name: Deploy Strategies to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 152.53.209.195
          username: kaushal
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: "/home/kaushal/strategy-engine"
          rm: false

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.53.209.195
          username: kaushal
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/kaushal/strategy-engine

            # Create venv if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Install dependencies
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # Fleet-wide config: Telegram credentials and the trade DB URL.
            # Version 2 moved these out of the per-strategy JSONs so a live
            # database password stops living in git, which means the file is
            # gitignored and cannot arrive by scp. Write it from a secret when
            # one is configured; never overwrite a file already on the server,
            # so a hand-edit on the host survives a deploy.
            if [ ! -f Live/engine.json ]; then
              if [ -n "${{ secrets.ENGINE_CONFIG_JSON }}" ]; then
                printf '%s' '${{ secrets.ENGINE_CONFIG_JSON }}' > Live/engine.json
                chmod 600 Live/engine.json
                echo "Wrote Live/engine.json from ENGINE_CONFIG_JSON."
              else
                echo "WARNING: Live/engine.json is missing and no"
                echo "ENGINE_CONFIG_JSON secret is set. Version 2 strategies"
                echo "will fail to start. Copy Live/engine.example.json and"
                echo "fill it in on the host, or add the secret."
              fi
            fi

            # This pipeline ships code only. It never starts or restarts a
            # strategy, and there is deliberately no PM2 step.
            #
            # Strategies run under Cronicle. ecosystem.config.cjs used to
            # declare a stopped PM2 copy of every S17/S21 strategy, and
            # `pm2 startOrRestart` starts stopped apps — running it here would
            # have launched a second copy of each alongside the Cronicle ones,
            # putting duplicate orders on live accounts. That file has since
            # been deleted so the trap cannot be re-armed by hand.
            #
            # Restarting stays a deliberate act rather than a side effect of
            # merging: a strategy may be holding open positions, and whoever
            # merges is not necessarily whoever is watching the account.
            # Restart from the dashboard Jobs page (/jobs), or in Cronicle,
            # once you have checked exposure.
            echo "Code deployed."

            # Reconcile Cronicle's schedule with the strategies in the repo.
            #
            # A strategy that has no event yet is created and started — it has
            # never run, so it holds no positions and starting it disturbs
            # nothing. A strategy whose code changed has its event definition
            # updated and is flagged as needing a restart, but is NOT
            # restarted: see above.
            #
            # Two things stop a double-start from placing duplicate orders:
            # the event's max_children of 1, and the engine's own startup
            # check, which refuses to run when the registry shows a live
            # heartbeat from another process.
            if [ -n "${{ secrets.CRONICLE_API_KEY }}" ]; then
              CRONICLE_API_KEY='${{ secrets.CRONICLE_API_KEY }}' \
              STRATEGY_DIR=/home/kaushal/strategy-engine \
              ./venv/bin/python scripts/sync_cronicle.py
            else
              echo "CRONICLE_API_KEY not set — skipping schedule sync."
              echo "Add it to the repository secrets to enable auto-registration."
              ./venv/bin/python scripts/sync_cronicle.py --dry-run || true
            fi
