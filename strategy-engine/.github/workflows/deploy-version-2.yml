name: Deploy Version 2

# TEMPORARY. Ships the Version-2 branch to the strategy host and registers its
# strategies with Cronicle, so pushing to Version-2 creates (and where it is
# safe to, starts) the Version 2 strategies.
#
# Delete this file once Version-2 merges to main — deploy-strategies.yml
# already does the same thing from main, and having two branches deploying to
# one directory is only tolerable while the second is the branch being worked
# on.
#
# WHY THE SAME DIRECTORY AS main. The strategies write their journals to a
# relative path ("./bridge/<name> Logs"), and those directories hold
# _fired_events.json — the record of which setups have already been traded.
# Deploying Version 2 somewhere else would give every strategy an empty ledger,
# so a setup traded minutes earlier could be traded again. The Version 1
# scripts are still present on this branch, so nothing is removed by shipping
# it here.
#
# SHADOW MODE. ALLOW_DUPLICATE is set here on purpose: the Version 2
# strategies are meant to run BESIDE their Version 1 counterparts so the two
# can be compared, rather than replacing them. Both guards that would normally
# refuse a second process on the same magic — the host scan and the registry
# heartbeat check — are turned off for this branch.
#
# That is only meaningful while two conditions hold, and only the second is
# enforced anywhere:
#
#   1. every account involved is a DEMO account, and
#   2. the Version 2 strategies trade DIFFERENT accounts from Version 1.
#
# Condition 2 is NOT true of the configs as generated — they were copied from
# Version 1, so each Version 2 strategy points at the same login. Two copies on
# one account both place orders against one balance and neither result means
# anything. Use scripts/repoint_v2_accounts.py to move them first.
#
# Remove ALLOW_DUPLICATE before this reaches main. On a real account it is the
# switch that turns one strategy into two.

on:
  push:
    branches:
      - Version-2
  workflow_dispatch:

concurrency:
  # Never let two deploys write the same directory at once.
  group: strategy-host-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the strategy host. Local development runs 3.14, which defers
          # annotation evaluation and hid a NameError that broke every
          # strategy on 3.12 — the version that actually matters.
          python-version: '3.12'
      - name: Install dependencies
        # requests is needed because the engine tests import engine/ directly
        # rather than through the probe, which stubs it. TA-Lib is not: it
        # needs a C library built from source, and the tests that use it
        # importorskip.
        run: pip install --quiet pandas numpy pytest requests
      - name: Probe every strategy
        run: python -m pytest test/test_live_execution.py -v --no-header -p no:cacheprovider
      - name: Engine and guard tests
        run: python -m pytest test/test_engine.py test/test_singleton.py test/test_sync_cronicle.py -q --no-header -p no:cacheprovider

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 152.53.209.195
          username: kaushal
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: "/home/kaushal/strategy-engine"
          rm: false

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.53.209.195
          username: kaushal
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/kaushal/strategy-engine

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # Fleet-wide config: Telegram credentials and the trade DB URL.
            # Gitignored, so it cannot arrive by scp. Never overwrite one that
            # is already on the host — a hand-edit there must survive a deploy.
            if [ ! -f Live/engine.json ]; then
              if [ -n "${{ secrets.ENGINE_CONFIG_JSON }}" ]; then
                printf '%s' '${{ secrets.ENGINE_CONFIG_JSON }}' > Live/engine.json
                chmod 600 Live/engine.json
                echo "Wrote Live/engine.json from ENGINE_CONFIG_JSON."
              else
                # Not fatal. The per-strategy sidecars carry the bridge URL and
                # API key, and trade_db falls back to its built-in database
                # URL, so a strategy still trades and still persists. What is
                # lost is Telegram: no entry, exit or failure alerts, including
                # the one that says persistence has broken. Warn loudly rather
                # than blocking the deploy.
                echo "::warning::Live/engine.json is missing and"
                echo "::warning::ENGINE_CONFIG_JSON is not set. Strategies will"
                echo "::warning::run without Telegram alerts. Copy"
                echo "::warning::Live/engine.example.json on the host, or add"
                echo "::warning::the secret."
              fi
            fi

            echo "--- what is running now ---"
            ps -eo pid,etime,args | grep '[s]trategy-engine' | head -20 || true

      - name: Register strategies with Cronicle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.53.209.195
          username: kaushal
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/kaushal/strategy-engine

            if [ -z "${{ secrets.CRONICLE_API_KEY }}" ]; then
              echo "CRONICLE_API_KEY is not set — reporting only, changing nothing."
              ./venv/bin/python scripts/sync_cronicle.py --dry-run || true
              exit 0
            fi

            # Shadow mode: create every missing event and start it even though
            # the Version 1 process still holds the same magic. See the note at
            # the top of this file for what that assumes.
            #
            # Updating an EXISTING event still never restarts it — that stays
            # a deliberate act, because a running strategy may be holding open
            # positions.
            # START_STOPPED also brings back events that exist but are not
            # running — after a crash, or a host reboot, which currently leaves
            # the whole fleet down until somebody notices. Nothing is running
            # them, so there is no process to disturb and no position being
            # managed: the same argument that makes starting a new event safe.
            # A RUNNING strategy is still never restarted by a deploy.
            #
            # Name the category rather than inherit one. Without this the sync
            # copies whatever category the neighbouring strategy events use,
            # which put the first V2 batch under "Kaushal Jobs". The id behind
            # the title is looked up at run time; if the category is missing
            # the sync warns and falls back rather than failing the deploy.
            CRONICLE_API_KEY='${{ secrets.CRONICLE_API_KEY }}' \
            STRATEGY_DIR=/home/kaushal/strategy-engine \
            CRONICLE_CATEGORY_TITLE='Sumit Jobs' \
            CRONICLE_USERNAME=sumit \
            ALLOW_DUPLICATE=1 \
            START_STOPPED=1 \
            ./venv/bin/python scripts/sync_cronicle.py
